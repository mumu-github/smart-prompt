name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
    branches:
      - main

jobs:
  node-tests:
    name: Node tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 扩展页运行时测试需要 --load-extension：品牌版 Chrome stable（137+）
      # 已禁用命令行加载扩展；headless-shell 是旧 headless 实现不支持扩展。
      # Playwright 的完整 Chromium 构建保留该 flag。
      - name: Install Chromium for extension runtime tests
        shell: pwsh
        run: |
          npx --yes playwright@latest install chromium
          $chrome = Get-ChildItem "$env:LOCALAPPDATA\ms-playwright" -Recurse -Filter "chrome.exe" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch 'headless' } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $chrome) { throw "chromium chrome.exe not found after install" }
          "CHROME_PATH=$chrome" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # 浏览器扩展 runtime-demo/options-runtime 需要本机 Chrome：
      # 通过上一步安装的 chrome-headless-shell（CHROME_PATH）运行。
      - name: Run all Node test suites
        shell: pwsh
        run: npm run test:node

  rust-tests:
    name: Rust tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/local-service-sidecar -> target
            apps/desktop-shell/src-tauri -> target

      - name: Sidecar unit + contract tests
        run: cargo test --manifest-path apps/local-service-sidecar/Cargo.toml

      - name: Sidecar formatting
        run: cargo fmt --check --manifest-path apps/local-service-sidecar/Cargo.toml

      # 真实二进制 HTTP 契约：编译 sidecar 到临时 target 后拉起并验证。
      - name: Real-binary phase3 contract
        run: node apps/local-service-sidecar/tests/phase3-contract.test.js

      - name: Desktop shell Rust check
        shell: pwsh
        run: |
          # bundle.resources 指向 prepare-release 生成的 sidecar 目录（gitignored）；
          # cargo check 只校验资源路径存在，空目录即可满足。
          New-Item -ItemType Directory -Force -Path apps/desktop-shell/src-tauri/resources/smart-prompt-sidecar | Out-Null
          cargo check --manifest-path apps/desktop-shell/src-tauri/Cargo.toml
