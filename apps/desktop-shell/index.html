<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Smart Prompt Desktop</title>
    <link rel="stylesheet" href="src/styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <h1>Smart Prompt</h1>
          <p>V2 desktop shell</p>
        </div>
        <div class="status-actions">
          <span id="service-status" class="status-pill">checking</span>
          <button id="start-service" type="button">Start Service</button>
          <button id="stop-service" type="button">Stop Service</button>
          <button id="restart-service" type="button">Restart Service</button>
        </div>
      </header>

      <section id="first-run-panel" class="panel setup-panel">
        <h2>First Run</h2>
        <div id="first-run-progress" class="setup-progress">0/5 ready</div>
        <div id="privacy-boundary" class="privacy-boundary">
          <span>No full page body</span>
          <span>No page title</span>
          <span>No auto-submit</span>
          <span>Keys encrypted</span>
        </div>
        <div id="provider-test-status" class="skill-row">Provider test not run.</div>
        <button id="test-provider" type="button">Test Provider</button>
      </section>

      <section class="panel diagnostics-panel">
        <h2>Diagnostics</h2>
        <div class="diagnostics-actions">
          <button id="export-diagnostics" type="button">Export Diagnostics</button>
          <button id="clear-local-data" type="button">Clear Local Data</button>
        </div>
        <pre id="diagnostics-output" class="diagnostics-output">No diagnostics exported.</pre>
      </section>

      <section class="panel">
        <h2>LLM Settings</h2>
        <label>
          Provider
          <select id="provider">
            <option value="auto">Auto</option>
            <option value="agnes">Agnes</option>
            <option value="openai-compatible">OpenAI-compatible</option>
            <option value="anthropic">Anthropic</option>
            <option value="gemini">Gemini</option>
          </select>
        </label>
        <div id="provider-status" class="skill-row">Provider status unavailable.</div>
        <label>
          Base URL
          <input id="base-url" value="https://api.openai.com/v1">
        </label>
        <label>
          Model
          <input id="model" value="gpt-4o-mini">
        </label>
        <label>
          API Key
          <input id="api-key" type="password" placeholder="Stored by local service">
        </label>
        <label>
          Agnes Key
          <input id="agnes-api-key" type="password" placeholder="Stored by local service">
        </label>
        <label>
          OpenAI-compatible Key
          <input id="openai-api-key" type="password" placeholder="Stored by local service">
        </label>
        <label>
          Anthropic Key
          <input id="anthropic-api-key" type="password" placeholder="Stored by local service">
        </label>
        <label>
          Gemini Key
          <input id="gemini-api-key" type="password" placeholder="Stored by local service">
        </label>
        <button id="save-settings" type="button">Save Settings</button>
      </section>

      <section class="panel">
        <h2>Skill Library</h2>
        <label>
          Folder path
          <input id="skill-folder" placeholder="C:\\Users\\you\\.codex\\skills">
        </label>
        <button id="import-folder" type="button">Import Folder</button>
        <div id="skill-list" class="skill-list"></div>
      </section>

      <section class="panel">
        <h2>Prompt Library</h2>
        <label>
          Title
          <input id="prompt-title" placeholder="Reusable prompt title">
        </label>
        <label>
          Prompt
          <textarea id="prompt-body" rows="5" placeholder="Save a reusable prompt locally"></textarea>
        </label>
        <button id="save-prompt" type="button">Save Prompt</button>
        <div id="prompt-list" class="skill-list"></div>
      </section>

      <section class="panel">
        <h2>Shortcut</h2>
        <label>
          Global shortcut
          <input id="shortcut" value="CmdOrCtrl+Shift+Space">
        </label>
        <button id="save-shortcut" type="button">Save Shortcut</button>
      </section>
    </main>
    <script src="src/app.js"></script>
  </body>
</html>
