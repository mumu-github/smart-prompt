<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ChatGPT Demo - Smart Prompt Copilot</title>
    <link rel="stylesheet" href="../src/content.css">
    <style>
      * {
        box-sizing: border-box;
        letter-spacing: 0;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #eef2f1;
        color: #172124;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .demo-shell {
        width: min(980px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 42px 0;
      }

      .demo-chat {
        min-height: 560px;
        display: grid;
        grid-template-rows: 1fr auto;
        border: 1px solid rgba(31, 44, 48, 0.14);
        border-radius: 8px;
        background: #fbfaf7;
        box-shadow: 0 18px 48px rgba(24, 40, 45, 0.14);
      }

      .demo-thread {
        padding: 24px;
      }

      .demo-message {
        width: min(620px, 100%);
        padding: 14px 16px;
        border-radius: 8px;
        background: #ffffff;
        border: 1px solid rgba(31, 44, 48, 0.12);
        line-height: 1.55;
      }

      .composer {
        padding: 18px;
        border-top: 1px solid rgba(31, 44, 48, 0.11);
      }

      textarea {
        display: block;
        width: 100%;
        min-height: 96px;
        resize: vertical;
        border: 1px solid rgba(31, 44, 48, 0.18);
        border-radius: 8px;
        padding: 14px;
        background: #ffffff;
        color: #172124;
        font: inherit;
        font-size: 15px;
        line-height: 1.5;
        outline: none;
      }

      textarea:focus {
        border-color: #2e8f8c;
        box-shadow: 0 0 0 3px rgba(46, 143, 140, 0.12);
      }
    </style>
  </head>
  <body>
    <main class="demo-shell">
      <section class="demo-chat">
        <div class="demo-thread">
          <div class="demo-message">Demo 输入框用于检查扩展第一版的悬浮入口、三模式 prompt card 和一键填入。</div>
        </div>
        <div class="composer">
          <textarea autofocus placeholder="试试：帮我做一个 CRM 后台，要有客户列表和跟进记录"></textarea>
        </div>
      </section>
    </main>
    <script>
      window.chrome = {
        runtime: {
          getURL(path) {
            return `../${path}`;
          }
        },
        storage: {
          local: {
            get(keys, callback) {
              callback({
                smartPromptSkills: [
                  {
                    id: "demo-skill-product",
                    name: "product-prd",
                    description: "补齐用户故事、范围、验收标准和里程碑。",
                    tags: ["prd", "产品", "验收", "里程碑"],
                    source_type: "demo"
                  }
                ]
              });
            },
            set(values, callback) {
              callback && callback();
            }
          },
          onChanged: {
            addListener() {}
          }
        }
      };
    </script>
    <script src="../src/site-adapters.js"></script>
    <script src="../src/local-service-client.js"></script>
    <script src="../src/prompt-engine.js"></script>
    <script src="../src/content.js"></script>
    <script>
      if (new URLSearchParams(location.search).has("open")) {
        setTimeout(() => {
          const input = document.querySelector("textarea");
          input.value = "帮我做一个 CRM 后台，要有客户列表和跟进记录";
          input.focus();
          input.dispatchEvent(new InputEvent("input", { bubbles: true, inputType: "insertText", data: input.value }));
          document.getElementById("smart-prompt-mascot")?.click();
        }, 260);
      }
    </script>
  </body>
</html>
